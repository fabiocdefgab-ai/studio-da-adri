
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Studio da Adri</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f1f4;
      color: #30252c;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000010;
    }

    h1, h2 { text-align: center; }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin: 5px 3px;
      border: 0;
      border-radius: 8px;
      background: #70445d;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .cancelar { background: #a33b3b; }
    .sair { background: #555; }
    .atualizar { background: #a17b35; }
    .whatsapp { background: #218838; }

    .agendamento {
      border: 1px solid #e2d7dd;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
    }

    .status {
      font-weight: bold;
      color: #70445d;
    }

    #painel, #login {
      display: none;
    }

    #mensagem {
      text-align: center;
      margin: 15px 0;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .topo, .filtro {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .filtro {
      flex-direction: column;
      margin: 20px 0;
      padding: 15px;
      background: #f7f1f4;
      border-radius: 12px;
    }

    .filtro input {
      max-width: 300px;
      background: white;
    }
  </style>
</head>

<body>

<main>
  <h1>Studio da Adri</h1>
  <h2>Painel administrativo</h2>

  <section id="login">
    <h2>Entrar</h2>

    <form id="formLogin">
      <input
        id="email"
        type="email"
        placeholder="E-mail"
        autocomplete="username"
        required
      >

      <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
        required
      >

      <button type="submit">Entrar no painel</button>
    </form>
  </section>

  <section id="painel">

    <div class="topo">
      <button class="sair" id="botaoSair">Sair</button>

      <button class="atualizar" id="botaoAtualizar">
        Atualizar agendamentos
      </button>
    </div>

    <h2>Agenda do Studio</h2>

    <div class="filtro">
      <label for="filtroData">
        <strong>Escolher dia da agenda:</strong>
      </label>

      <input type="date" id="filtroData">

      <button type="button" id="limparFiltro">
        Mostrar todos
      </button>
    </div>

    <h2>Agendamentos</h2>

    <div id="lista"></div>

  </section>

  <div id="mensagem" role="status" aria-live="polite"></div>
</main>

<script>
const SUPABASE_URL =
  "https://kydxzvqjeiadknojlesv.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Mhg5z2RJ-Vuoc3wqbGyFfA_FODUKIhw";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const login = document.getElementById("login");
const painel = document.getElementById("painel");
const mensagem = document.getElementById("mensagem");
const lista = document.getElementById("lista");
const filtroData = document.getElementById("filtroData");

let agendamentos = [];

function mostrarLogin() {
  login.style.display = "block";
  painel.style.display = "none";
}

function mostrarPainel() {
  login.style.display = "none";
  painel.style.display = "block";
}

function formatarData(data) {
  if (!data) return "Não informada";

  const partes = data.split("-");

  return partes.length === 3
    ? partes[2] + "/" + partes[1] + "/" + partes[0]
    : data;
}

// WHATSAPP COM MENSAGEM PERSONALIZADA
function abrirWhatsApp(item) {
  let telefone = String(item.client_phone || "")
    .replace(/\D/g, "");

  if (!telefone) {
    mensagem.textContent = "Telefone não informado.";
    return;
  }

  if (!telefone.startsWith("55")) {
    telefone = "55" + telefone;
  }

  const nome = item.client_name || "cliente";
  const servico = item.services?.name || "serviço";
  const data = formatarData(item.appointment_date);
  const horario = String(item.appointment_time || "").slice(0, 5);

  const texto =
    "Olá, " + nome + "! Aqui é do Studio da Adri. " +
    "Estou entrando em contato sobre seu agendamento: " +
    servico + ", marcado para " + data +
    " às " + horario + ". Podemos conversar?";

  const link =
    "https://wa.me/" + telefone +
    "?text=" + encodeURIComponent(texto);

  window.open(link, "_blank", "noopener,noreferrer");
}

async function carregarAgendamentos() {
  lista.textContent = "Carregando agendamentos...";
  mensagem.textContent = "";

  const { data, error } = await db
    .from("bookings")
    .select(`
      id,
      client_name,
      client_phone,
      appointment_date,
      appointment_time,
      notes,
      status,
      services(name)
    `)
    .order("appointment_date", { ascending: true })
    .order("appointment_time", { ascending: true });

  if (error) {
    console.error(error);
    lista.textContent = "";
    mensagem.textContent =
      "Não foi possível carregar os agendamentos.";
    return;
  }

  agendamentos = data || [];

  mostrarAgendamentos();
}

function mostrarAgendamentos() {
  lista.innerHTML = "";

  const dataSelecionada = filtroData.value;

  const filtrados = agendamentos.filter(item => {
    return !dataSelecionada ||
      item.appointment_date === dataSelecionada;
  });

  if (filtrados.length === 0) {
    lista.textContent = dataSelecionada
      ? "Nenhum agendamento nesta data."
      : "Nenhum agendamento encontrado.";

    return;
  }

  const titulo = document.createElement("p");

  titulo.textContent =
    filtrados.length + " agendamento(s) encontrado(s).";

  lista.appendChild(titulo);

  filtrados.forEach(item => {
    const card = document.createElement("article");
    card.className = "agendamento";

    const nome = document.createElement("h3");
    nome.textContent = item.client_name || "Cliente";
    card.appendChild(nome);

    const informacoes = [
      "Telefone: " + (item.client_phone || "Não informado"),
      "Serviço: " + (item.services?.name || "Não informado"),
      "Data: " + formatarData(item.appointment_date),
      "Horário: " + String(item.appointment_time || "").slice(0, 5),
      "Observações: " + (item.notes || "Nenhuma")
    ];

    informacoes.forEach(texto => {
      const paragrafo = document.createElement("p");
      paragrafo.textContent = texto;
      card.appendChild(paragrafo);
    });

    const status = document.createElement("p");
    status.className = "status";
    status.textContent =
      "Situação: " + String(item.status).toUpperCase();

    card.appendChild(status);

    const acoes = document.createElement("div");
    acoes.className = "acoes";

    if (item.client_phone) {
      const whatsapp = document.createElement("button");

      whatsapp.textContent = "Conversar pelo WhatsApp";
      whatsapp.className = "whatsapp";
      whatsapp.onclick = () => abrirWhatsApp(item);

      acoes.appendChild(whatsapp);
    }

    if (item.status === "pending") {
      const confirmar = document.createElement("button");

      confirmar.textContent = "Confirmar";

      confirmar.onclick = () =>
        alterarStatus(item.id, "confirmed", confirmar);

      acoes.appendChild(confirmar);
    }

    if (item.status !== "cancelled") {
      const cancelar = document.createElement("button");

      cancelar.textContent = "Cancelar";
      cancelar.className = "cancelar";

      cancelar.onclick = () =>
        alterarStatus(item.id, "cancelled", cancelar);

      acoes.appendChild(cancelar);
    }

    card.appendChild(acoes);
    lista.appendChild(card);
  });
}

async function alterarStatus(id, novoStatus, botao) {
  const confirmacao = novoStatus === "confirmed"
    ? "Confirma este agendamento?"
    : "Deseja cancelar este agendamento?";

  if (!window.confirm(confirmacao)) return;

  botao.disabled = true;

  const { error } = await db
    .from("bookings")
    .update({ status: novoStatus })
    .eq("id", id);

  if (error) {
    console.error(error);

    mensagem.textContent =
      "Não foi possível atualizar o agendamento.";

    botao.disabled = false;
    return;
  }

  mensagem.textContent = "Agendamento atualizado!";

  await carregarAgendamentos();
}

document.getElementById("formLogin")
  .addEventListener("submit", async event => {

    event.preventDefault();

    mensagem.textContent = "Verificando acesso...";

    const email =
      document.getElementById("email").value.trim();

    const senha =
      document.getElementById("senha").value;

    const { error } = await db.auth.signInWithPassword({
      email,
      password: senha
    });

    if (error) {
      mensagem.textContent =
        "Não foi possível entrar. Confira e-mail e senha.";
      return;
    }

    await verificarAcesso();
  });

async function verificarAcesso() {
  const { data } = await db.auth.getSession();

  if (!data.session) {
    mostrarLogin();
    return;
  }

  const { data: administrador, error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.session.user.id)
    .maybeSingle();

  if (error || !administrador) {
    await db.auth.signOut();

    mostrarLogin();

    mensagem.textContent =
      "Esta conta não tem autorização de administrador.";

    return;
  }

  mostrarPainel();

  await carregarAgendamentos();
}

document.getElementById("botaoSair").onclick =
  async () => {
    await db.auth.signOut();

    agendamentos = [];
    lista.innerHTML = "";

    mostrarLogin();

    mensagem.textContent = "Você saiu do painel.";
  };

document.getElementById("botaoAtualizar").onclick =
  carregarAgendamentos;

filtroData.addEventListener("change", mostrarAgendamentos);

document.getElementById("limparFiltro").onclick = () => {
  filtroData.value = "";
  mostrarAgendamentos();
};

verificarAcesso();
</script>

</body>
</html>
