<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio da Adri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f1f4;
  color: #30252c;
  font-family: Arial, sans-serif;
}

#inicio {
  background: #100d0b;
  color: #d6b36a;
  text-align: center;
  padding: 35px 20px;
}

#inicio img {
  width: 100%;
  max-width: 320px;
  height: auto;
  display: block;
  margin: 0 auto 20px;
}

#inicio h1 {
  margin: 10px 0;
}

#inicio p {
  margin-bottom: 20px;
}

main {
  max-width: 500px;
  margin: 25px auto;
  padding: 22px;
  background: white;
  border-radius: 16px;
}

h2 {
  text-align: center;
}

label {
  display: block;
  margin-top: 16px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: #70445d;
  color: white;
  border: 0;
  border-radius: 9px;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#inicio button {
  background: #d6b36a;
  color: #100d0b;
  font-weight: bold;
}

#mensagem {
  text-align: center;
  margin-top: 16px;
}

#mensagem a {
  color: #176b36;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #665;
}
</style>
</head>

<body>

<section id="inicio">
  <img src="logo-studio-da-adri.jpg" alt="Logo Studio da Adri">
  <h1>Studio da Adri</h1>
  <p>Beleza e cuidado com você</p>

  <button type="button" onclick="document.getElementById('formulario').scrollIntoView({behavior:'smooth'})">
    AGENDAR HORÁRIO
  </button>
</section>

<main>
  <h2>Agende seu horário</h2>

  <form id="formulario">

    <label for="nome">Seu nome</label>
    <input id="nome" required maxlength="100" autocomplete="name">

    <label for="telefone">Seu WhatsApp</label>
    <input id="telefone" type="tel" required maxlength="20" autocomplete="tel">

    <label for="servico">Serviço desejado</label>
    <select id="servico" required>
      <option value="">Carregando serviços...</option>
    </select>

    <label for="data">Data</label>
    <input id="data" type="date" required>

    <label for="horario">Horário</label>
    <select id="horario" required>
      <option value="">Escolha a data primeiro</option>
    </select>

    <label for="observacoes">Observações (opcional)</label>
    <textarea id="observacoes" rows="3" maxlength="500"></textarea>

    <button id="enviar" type="submit">
      Solicitar agendamento
    </button>

  </form>

  <div id="mensagem" role="status" aria-live="polite"></div>
</main>

<footer>
  Atendimento mediante agendamento.
</footer>

<script>
const SUPABASE_URL = "https://kydxzvqjeiadknojlesv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Mhg5z2RJ-Vuoc3wqbGyFfA_FODUKIhw";
const WHATSAPP = "5546988103646";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const formulario = document.getElementById("formulario");
const servico = document.getElementById("servico");
const data = document.getElementById("data");
const horario = document.getElementById("horario");
const mensagem = document.getElementById("mensagem");
const botao = document.getElementById("enviar");

function dataLocal(dia) {
  return [
    dia.getFullYear(),
    String(dia.getMonth() + 1).padStart(2, "0"),
    String(dia.getDate()).padStart(2, "0")
  ].join("-");
}

function configurarLimiteDatas() {
  const hoje = new Date();
  const limite = new Date();

  limite.setDate(limite.getDate() + 7);

  data.min = dataLocal(hoje);
  data.max = dataLocal(limite);
}

configurarLimiteDatas();

async function carregarServicos() {
  const { data: lista, error } = await db
    .from("services")
    .select("id,name")
    .eq("is_active", true)
    .order("name");

  if (error) {
    console.error(error);
    mensagem.textContent =
      "Não foi possível carregar os serviços. Atualize a página.";

    servico.innerHTML =
      '<option value="">Serviços indisponíveis</option>';
    return;
  }

  servico.innerHTML =
    '<option value="">Selecione um serviço</option>';

  (lista || []).forEach(item => {
    const opcao = document.createElement("option");
    opcao.value = item.id;
    opcao.textContent = item.name;
    servico.appendChild(opcao);
  });

  if (!lista || lista.length === 0) {
    servico.innerHTML =
      '<option value="">Nenhum serviço disponível</option>';
  }
}

async function carregarHorarios() {
  horario.innerHTML =
    '<option value="">Carregando horários...</option>';

  if (!data.value) {
    horario.innerHTML =
      '<option value="">Escolha a data primeiro</option>';
    return;
  }

  const dia = new Date(data.value + "T12:00:00").getDay();

  if (dia === 0) {
    horario.innerHTML =
      '<option value="">Fechado aos domingos</option>';
    return;
  }

  const { data: ocupados, error } =
    await db.rpc("get_public_booked_slots");

  if (error) {
    console.error("Erro ao consultar horários:", error);

    horario.innerHTML =
      '<option value="">Não foi possível consultar horários</option>';
    return;
  }

  const ocupadosNoDia = (ocupados || [])
    .filter(item => item.appointment_date === data.value)
    .map(item => String(item.appointment_time).slice(0, 5));

  const abertura = dia === 6 ? 8 * 60 : 8 * 60 + 30;
  const fechamento = dia === 6 ? 16 * 60 : 19 * 60;

  horario.innerHTML =
    '<option value="">Selecione um horário</option>';

  let livres = 0;

  for (
    let minutos = abertura;
    minutos < fechamento;
    minutos += 30
  ) {
    const h = String(Math.floor(minutos / 60)).padStart(2, "0");
    const m = String(minutos % 60).padStart(2, "0");
    const valor = h + ":" + m;

    if (ocupadosNoDia.includes(valor)) {
      continue;
    }

    const opcao = document.createElement("option");
    opcao.value = valor;
    opcao.textContent = valor;

    horario.appendChild(opcao);
    livres++;
  }

  if (livres === 0) {
    horario.innerHTML =
      '<option value="">Não há horários livres nesta data</option>';
  }
}

data.addEventListener("change", carregarHorarios);

formulario.addEventListener("submit", async e => {
  e.preventDefault();

  if (!formulario.reportValidity()) return;

  botao.disabled = true;
  mensagem.textContent = "Enviando solicitação...";

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  try {
    const { error } = await db
      .from("bookings")
      .insert({
        client_name: nome,
        client_phone: telefone,
        service_id: servico.value,
        appointment_date: data.value,
        appointment_time: horario.value,
        notes: document.getElementById("observacoes").value.trim(),
        status: "pending"
      });

    if (error) {
      console.error("Erro ao registrar agendamento:", error);

      mensagem.textContent =
        "Não foi possível solicitar esse horário. Ele pode estar ocupado. Tente outro.";

      return;
    }

    mensagem.textContent =
      "Solicitação registrada! Para avisar o Studio, toque no botão abaixo.";

    const texto = encodeURIComponent(
      "Olá! Fiz uma solicitação de agendamento no Studio da Adri." +
      "\nNome: " + nome +
      "\nTelefone: " + telefone +
      "\nServiço: " + servico.options[servico.selectedIndex].text +
      "\nData: " + data.value +
      "\nHorário: " + horario.value
    );

    const link = document.createElement("a");

    link.href = "https://wa.me/" + WHATSAPP + "?text=" + texto;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Enviar mensagem pelo WhatsApp";
    link.style.display = "block";
    link.style.marginTop = "18px";

    mensagem.appendChild(link);

    formulario.reset();
    configurarLimiteDatas();

    horario.innerHTML =
      '<option value="">Escolha a data primeiro</option>';

  } catch (erro) {
    console.error("Falha inesperada:", erro);

    mensagem.textContent =
      "Ocorreu um erro de conexão. Verifique a internet e tente novamente.";

  } finally {
    botao.disabled = false;
  }
});

carregarServicos();
</script>

</body>
</html>
