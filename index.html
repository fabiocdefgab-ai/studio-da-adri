
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Barbearia do Gaúcho</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101010;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

header {
  background: #050505;
  color: #d6b36a;
  text-align: center;
  padding: 30px 15px;
  border-bottom: 2px solid #b99750;
}

.logo {
  display: block;
  width: 100%;
  max-width: 280px;
  max-height: 240px;
  object-fit: contain;
  margin: 0 auto 15px;
}

header h1 {
  margin: 10px 0;
  font-size: 30px;
  letter-spacing: 1px;
}

header p { color: #d6b36a; }

main {
  max-width: 520px;
  margin: 25px auto;
  padding: 24px;
  background: #1c1c1c;
  border: 1px solid #9d7b3e;
  border-radius: 14px;
}

h2 {
  text-align: center;
  color: #d6b36a;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 17px;
  font-weight: bold;
  color: #e5c77f;
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  margin-top: 7px;
  background: #292929;
  color: white;
  border: 1px solid #777;
  border-radius: 8px;
  font-size: 16px;
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid #d6b36a;
  border-color: #d6b36a;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 24px;
  background: #d6b36a;
  color: #111;
  border: 0;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#mensagem {
  text-align: center;
  margin-top: 18px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#mensagem a {
  display: block;
  margin-top: 15px;
  padding: 13px;
  background: #176b3a;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 22px 15px;
  color: #c6a45d;
  font-size: 13px;
}

@media (max-width: 600px) {
  main { margin: 18px 12px; padding: 20px; }
  header h1 { font-size: 25px; }
}
</style>
</head>

<body>

<header>
  <img
    class="logo"
    src="logo-barbearia-do-gaucho.jpg"
    alt="Logotipo da Barbearia do Gaúcho"
  >
  <h1>Barbearia do Gaúcho</h1>
  <p>Tradição e qualidade desde 1998</p>
</header>

<main>
  <h2>Agende seu horário</h2>

  <form id="formulario">

    <label for="nome">Seu nome</label>
    <input id="nome" type="text" required maxlength="100"
      autocomplete="name" placeholder="Digite seu nome">

    <label for="telefone">Seu WhatsApp</label>
    <input id="telefone" type="tel" required maxlength="20"
      autocomplete="tel" placeholder="(00) 00000-0000">

    <label for="servico">Serviço desejado</label>
    <select id="servico" required>
      <option value="">Carregando serviços...</option>
    </select>

    <label for="data">Data</label>
    <input id="data" type="date" required>

    <label for="horario">Horário</label>
    <select id="horario" required>
      <option value="">Escolha a data primeiro</option>
    </select>

    <label for="observacoes">Observações (opcional)</label>
    <textarea id="observacoes" rows="3" maxlength="500"
      placeholder="Alguma observação?"></textarea>

    <button id="enviar" type="submit">
      Solicitar agendamento
    </button>
  </form>

  <div id="mensagem" role="status" aria-live="polite"></div>
</main>

<footer>
  © 2026 Barbearia do Gaúcho<br>
  Tradição, estilo e qualidade desde 1998.<br>
  Atendimento mediante agendamento.
</footer>

<script>
// CONFIGURAÇÕES DO SISTEMA

const SUPABASE_URL =
  "https://kydxzvqjeiadknojlesv.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Mhg5z2RJ-Vuoc3wqbGyFfA_FODUKIhw";

// WHATSAPP CORRETO DO PROPRIETÁRIO
const WHATSAPP = "5546999815786";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const formulario = document.getElementById("formulario");
const servico = document.getElementById("servico");
const data = document.getElementById("data");
const horario = document.getElementById("horario");
const mensagem = document.getElementById("mensagem");
const botao = document.getElementById("enviar");

function dataHojeLocal() {
  const hoje = new Date();

  return [
    hoje.getFullYear(),
    String(hoje.getMonth() + 1).padStart(2, "0"),
    String(hoje.getDate()).padStart(2, "0")
  ].join("-");
}

data.min = dataHojeLocal();

// CARREGAR SERVIÇOS

async function carregarServicos() {
  servico.innerHTML =
    '<option value="">Carregando serviços...</option>';

  const { data: lista, error } = await db
    .from("services")
    .select("id,name")
    .eq("is_active", true)
    .order("name");

  if (error) {
    console.error(error);
    servico.innerHTML =
      '<option value="">Serviços indisponíveis</option>';
    mensagem.textContent =
      "Não foi possível carregar os serviços. Atualize a página.";
    return;
  }

  servico.innerHTML =
    '<option value="">Selecione um serviço</option>';

  (lista || []).forEach(item => {
    const opcao = document.createElement("option");
    opcao.value = item.id;
    opcao.textContent = item.name;
    servico.appendChild(opcao);
  });

  if (!lista || lista.length === 0) {
    servico.innerHTML =
      '<option value="">Nenhum serviço disponível</option>';
  }
}

// HORÁRIOS DE ATENDIMENTO

function carregarHorarios() {
  horario.innerHTML =
    '<option value="">Selecione um horário</option>';

  if (!data.value) return;

  if (data.value < dataHojeLocal()) {
    horario.innerHTML =
      '<option value="">Escolha uma data válida</option>';
    return;
  }

  const dia = new Date(
    data.value + "T12:00:00"
  ).getDay();

  if (dia === 0) {
    horario.innerHTML =
      '<option value="">Fechado aos domingos</option>';
    return;
  }

  const abertura = dia === 6 ? 8 * 60 : 8 * 60 + 30;
  const fechamento = dia === 6 ? 16 * 60 : 19 * 60;

  for (
    let minutos = abertura;
    minutos < fechamento;
    minutos += 30
  ) {
    const h = String(Math.floor(minutos / 60))
      .padStart(2, "0");

    const m = String(minutos % 60)
      .padStart(2, "0");

    const opcao = document.createElement("option");
    opcao.value = h + ":" + m;
    opcao.textContent = h + ":" + m;

    horario.appendChild(opcao);
  }
}

data.addEventListener("change", carregarHorarios);

// ENVIAR AGENDAMENTO

formulario.addEventListener("submit", async e => {
  e.preventDefault();

  if (!formulario.reportValidity()) return;

  if (data.value < dataHojeLocal()) {
    mensagem.textContent =
      "Escolha uma data de hoje ou futura.";
    return;
  }

  if (!servico.value || !horario.value) {
    mensagem.textContent =
      "Selecione um serviço e um horário.";
    return;
  }

  botao.disabled = true;
  mensagem.textContent = "Enviando solicitação...";

  const nome = document.getElementById("nome")
    .value.trim();

  const telefone = document.getElementById("telefone")
    .value.trim();

  const observacoes = document
    .getElementById("observacoes")
    .value.trim();

  try {
    const { error } = await db
      .from("bookings")
      .insert({
        client_name: nome,
        client_phone: telefone,
        service_id: servico.value,
        appointment_date: data.value,
        appointment_time: horario.value,
        notes: observacoes,
        status: "pending"
      });

    if (error) {
      console.error(error);
      mensagem.textContent =
        "Não foi possível solicitar esse horário. Ele pode estar ocupado. Tente outro.";
      return;
    }

    const servicoEscolhido =
      servico.options[servico.selectedIndex].text;

    const texto = encodeURIComponent(
      "Olá! Recebi uma nova solicitação de agendamento na Barbearia do Gaúcho." +
      "\nNome: " + nome +
      "\nTelefone: " + telefone +
      "\nServiço: " + servicoEscolhido +
      "\nData: " + data.value +
      "\nHorário: " + horario.value +
      "\nObservações: " + (observacoes || "Nenhuma")
    );

    const link = document.createElement("a");

    link.href =
      "https://wa.me/" + WHATSAPP + "?text=" + texto;

    link.target = "_blank";
    link.rel = "noopener noreferrer";

    link.textContent =
      "Avisar a Barbearia pelo WhatsApp";

    mensagem.textContent =
      "Agendamento registrado com sucesso! Para enviar os detalhes à barbearia, toque no botão abaixo.";

    mensagem.appendChild(link);

    formulario.reset();

    data.min = dataHojeLocal();

    horario.innerHTML =
      '<option value="">Escolha a data primeiro</option>';

  } catch (erro) {
    console.error(erro);

    mensagem.textContent =
      "Erro de conexão. Verifique sua internet e tente novamente.";

  } finally {
    botao.disabled = false;
  }
});

// INICIAR

carregarServicos();
</script>

</body>
</html>
