<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio da Adri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
corpo{margem:0;fundo:#f7f1f4;cor:#30252c;família da fonte:Arial,sans-serif}
cabeçalho{fundo:#382632;cor:branco;alinhamento-texto:centro;preenchimento:30px 15px}
cabeçalho h1{margem:0;tamanho da fonte:28px}
main{largura máxima:500px;margem:25px auto;preenchimento:22px;fundo:branco;raio da borda:16px}
h2{text-align:center}
label{display:block;margin-top:16px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:8px;font-size:16px}
botão{largura:100%;preenchimento:15px;margem-superior:22px;fundo:#70445d;cor:branco;borda:0;raio-da-borda:9px;tamanho-da-fonte:17px}
botão:desativado{opacidade:0,5}
#mensagem{text-align:center;margin-top:16px}
rodapé{texto alinhado:centro;preenchimento:20px;cor:#665}
</style>
</head>
<body>
<header>
<h1>Estúdio da Adri</h1>
<p>Beleza e cuidado com você</p>
</header>

<principal>
<h2>Agende seu horário</h2>

<form id="formulario">
<label for="nome">Seu nome</label>
<input id="nome" required maxlength="100" autocomplete="nome">

<label for="telefone">Seu WhatsApp</label>
<input id="telefone" type="tel" required maxlength="20" autocomplete="tel">

<label for="servico">Serviço desejado</label>
<select id="servico" required>
<option value="">Carregando serviços...</option>
</select>

<label for="data">Dados</label>
<input id="data" type="date" required>

<label for="horario">Horário</label>
<select id="horario" required>
<option value="">Escolha os dados primeiro</option>
</select>

<label for="observacoes">Observações (opcional)</label>
<textarea id="observacoes" rows="3" maxlength="500"></textarea>

<button id="enviar" type="submit">Solicitar agendamento</button>
</formulário>
<div id="mensagem" role="status" aria-live="polite"></div>
</main>

<footer>Atendimento mediante agendamento.</footer>

<script>
const SUPABASE_URL = "https://kydxzvqjeiadknojlesv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Mhg5z2RJ-Vuoc3wqbGyFfA_FODUKIhw";
const WHATSAPP = "5546988103646";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const formulario = document.getElementById("formulario");
const serviço = document.getElementById("servico");
const data = document.getElementById("data");
const horário = document.getElementById("horario");
const mensagem = document.getElementById("mensagem");
const botão = document.getElementById("enviar");

função dataHojeLocal(){
  const hoje = new Date();
  retornar [
    hoje.getFullYear(),
    String(hoje.getMonth()+1).padStart(2,"0"),
    String(hoje.getDate()).padStart(2,"0")
  ].juntar("-");
}
dados.min = dataHojeLocal();

função assíncrona carregarServiços(){
  const {data:lista,error} = await db
    .de("serviços")
    .select("id,name")
    .eq("is_active",true)
    .order("nome");

  se(erro){
    mensagem.textContent = "Não foi possível carregar os serviços. Atualize a página.";
    servico.innerHTML = '<option value="">Serviços indisponíveis</option>';
    retornar;
  }

  servico.innerHTML = '<option value="">Selecionar um serviço</option>';
  (lista || []).forEach(item=>{
    const opcao = document.createElement("option");
    opcao.value = item.id;
    opcao.textContent = item.nome;
    servico.appendChild(opcao);
  });

  if(!lista || lista.length === 0){
    servico.innerHTML = '<option value="">Nenhum serviço disponível</option>';
  }
}

função carregarHorários(){
  horario.innerHTML = '<option value="">Selecionar um horário</option>';
  Se (!data.value) retornar;

  const dia = new Date(data.value + "T12:00:00").getDay();

  se(dia === 0){
    horario.innerHTML = '<option value="">Fechado aos domingos</option>';
    retornar;
  }

  const abertura = dia === 6 ? 8*60 : 8*60+30;
  const fechamento = dia === 6 ? 16*60 : 19*60;

  for(let minutos=abertura; minutos<fechamento; minutos+=30){
    const h = String(Math.floor(minutos/60)).padStart(2,"0");
    const m = String(minutos%60).padStart(2,"0");
    const opcao = document.createElement("option");
    opcao.value = h + ":" + m;
    opcao.textContent = h + ":" + m;
    horario.appendChild(opcao);
  }
}
data.addEventListener("change",carregarHorarios);

formulario.addEventListener("submit",async e=>{
  e.preventDefault();

  if(!formulario.reportValidity()) return;

  botao.disabled = true;
  mensagem.textContent = "Enviando solicitação...";

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  tentar{
    const {error} = await db
      .from("reservas")
      .inserir({
        nome_do_cliente: nome,
        telefone_do_cliente: telefone,
        service_id: servico.value,
        data_do_compromisso: data.valor,
        horário_do_compartilhamento: valor_do_horário,
        notas: document.getElementById("observacoes").value.trim(),
        status: "pendente"
      });

    se(erro){
      console.error("Erro ao agendamento do registrador:",error);
      mensagem.textContent = "Não foi possível solicitar esse horário. Ele pode estar ocupado. Tente outro.";
      botao.disabled = false;
      retornar;
    }

    mensagem.textContent = "Solicitação registrada! Para avisar o Studio, toque no botão abaixo.";

    const texto = encodeURIComponent(
      "Olá! Fiz uma solicitação de agendamento no Studio da Adri." +
      "\nNome: " + nome +
      "\nTelefone: " + telefone +
      "\nServiço: " + servico.options[servico.selectedIndex].text +
      "\nDados: " + data.value +
      "\nHorário: " + horario.value
    );

    const link = document.createElement("a");
    link.href = "https://wa.me/" + WHATSAPP + "?text=" + texto;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Enviar mensagem pelo WhatsApp";
    link.style.display = "bloco";
    link.style.marginTop = "18px";
    mensagem.appendChild(link);
    formulario.reset();
    dados.min = dataHojeLocal();
    horario.innerHTML = '<option value="">Escolher os dados primeiro</option>';
  }catch(erro){
    console.error("Falha inesperada:",erro);
    mensagem.textContent = "Ocorreu um erro de conexão. Verifique a internet e tente novamente.";
  }finalmente{
    botao.disabled = false;
  }
});

carregarServicos();
</script>
</body>
</html>
